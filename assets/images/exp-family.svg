<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Family entertainment experience">
  <defs>
    <linearGradient id="fa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#2a1e18"/>
    </linearGradient>
    <linearGradient id="fa-sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4030"/>
      <stop offset="100%" stop-color="#3d2a20"/>
    </linearGradient>
    <linearGradient id="fa-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="40%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ff8a65"/>
    </linearGradient>
    <radialGradient id="fa-glow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffcc80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffcc80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="700" fill="url(#fa-bg)"/>
  <ellipse cx="450" cy="220" rx="340" ry="180" fill="url(#fa-glow)"/>
  <!-- living room TV -->
  <g transform="translate(450 210)">
    <rect x="-220" y="-120" width="440" height="250" rx="12" fill="#0d0d0d" stroke="#3a3a3a" stroke-width="3"/>
    <rect x="-205" y="-105" width="410" height="220" rx="4" fill="url(#fa-screen)"/>
    <!-- show content shapes - family show vibe -->
    <circle cx="-80" cy="-20" r="36" fill="#fff" opacity="0.85"/>
    <circle cx="-40" cy="-10" r="42" fill="#fff" opacity="0.9"/>
    <circle cx="10" cy="-15" r="38" fill="#fff" opacity="0.85"/>
    <circle cx="55" cy="-5" r="28" fill="#fff" opacity="0.75"/>
    <ellipse cx="-20" cy="55" rx="120" ry="40" fill="#fff" opacity="0.5"/>
    <!-- stand -->
    <path d="M-20 135 L20 135 L35 160 L-35 160 Z" fill="#2a2a2a"/>
    <rect x="-50" y="160" width="100" height="8" rx="2" fill="#333"/>
  </g>
  <!-- sofa with family silhouettes -->
  <g transform="translate(450 520)">
    <rect x="-260" y="-40" width="520" height="90" rx="18" fill="url(#fa-sofa)"/>
    <rect x="-280" y="-70" width="70" height="100" rx="14" fill="#4a3428"/>
    <rect x="210" y="-70" width="70" height="100" rx="14" fill="#4a3428"/>
    <!-- people silhouettes -->
    <g fill="#2a1c16" opacity="0.85">
      <!-- adult left -->
      <circle cx="-140" cy="-95" r="22"/>
      <path d="M-175 -70 Q-140 -85 -105 -70 L-100 -20 L-180 -20 Z"/>
      <!-- child -->
      <circle cx="-40" cy="-80" r="16"/>
      <path d="M-65 -62 Q-40 -72 -15 -62 L-12 -20 L-68 -20 Z"/>
      <!-- child 2 -->
      <circle cx="40" cy="-78" r="15"/>
      <path d="M16 -60 Q40 -70 64 -60 L66 -20 L14 -20 Z"/>
      <!-- adult right -->
      <circle cx="140" cy="-95" r="22"/>
      <path d="M105 -70 Q140 -85 175 -70 L180 -20 L100 -20 Z"/>
    </g>
  </g>
  <!-- warm lamp glow -->
  <circle cx="120" cy="380" r="40" fill="#ffb74d" opacity="0.15"/>
  <rect x="108" y="400" width="24" height="80" rx="4" fill="#5c4030" opacity="0.6"/>
  <text x="450" y="60" text-anchor="middle" fill="#ffcc80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3" opacity="0.7">FAMILY NIGHT</text>
</svg>
