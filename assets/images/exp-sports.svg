<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Sports dynamic experience">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06140a"/>
      <stop offset="100%" stop-color="#0a1f10"/>
    </linearGradient>
    <linearGradient id="sp-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f8f45"/>
      <stop offset="100%" stop-color="#0d5c28"/>
    </linearGradient>
    <radialGradient id="sp-spot" cx="60%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#sp-bg)"/>
  <ellipse cx="540" cy="250" rx="280" ry="200" fill="url(#sp-spot)"/>
  <!-- stadium field perspective -->
  <path d="M40 700 L220 280 L680 280 L860 700 Z" fill="url(#sp-field)" opacity="0.9"/>
  <path d="M220 280 L680 280" stroke="#fff" stroke-opacity="0.45" stroke-width="3"/>
  <path d="M280 380 L620 380" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M340 480 L560 480" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>
  <ellipse cx="450" cy="280" rx="70" ry="28" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2.5"/>
  <path d="M450 280 L160 700 M450 280 L740 700" stroke="#fff" stroke-opacity="0.15" stroke-width="2"/>
  <!-- motion streaks -->
  <g stroke="#ff6600" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M120 180 C200 200, 280 210, 360 200"/>
    <path d="M100 220 C190 235, 270 240, 350 225" opacity="0.5"/>
    <path d="M140 150 C220 165, 300 170, 380 155" opacity="0.4"/>
  </g>
  <!-- ball with motion -->
  <g transform="translate(620 200)">
    <ellipse cx="-40" cy="8" rx="50" ry="12" fill="#000" opacity="0.25"/>
    <circle r="52" fill="url(#sp-ball)"/>
    <path d="M-20 -40 Q0 -10 20 -40 M-35 0 Q0 15 35 0 M-20 40 Q0 10 20 40 M0 -48 Q-15 0 0 48 M0 -48 Q15 0 0 48" fill="none" stroke="#222" stroke-width="3"/>
    <!-- speed lines -->
    <path d="M-90 -10 H-62 M-95 5 H-65 M-88 20 H-60" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- scoreboard hint -->
  <rect x="48" y="48" width="160" height="64" rx="8" fill="#0a0a0a" stroke="#3ddc84" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="128" y="78" text-anchor="middle" fill="#3ddc84" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">LIVE</text>
  <text x="128" y="98" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2" opacity="0.6">4K SPORTS</text>
</svg>
