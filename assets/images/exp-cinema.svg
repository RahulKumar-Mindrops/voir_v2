<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cinema vibrant colour experience">
  <defs>
    <linearGradient id="cin-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="50%" stop-color="#1a0a18"/>
      <stop offset="100%" stop-color="#120810"/>
    </linearGradient>
    <linearGradient id="cin-spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="18%" stop-color="#ff9500"/>
      <stop offset="36%" stop-color="#ffcc00"/>
      <stop offset="52%" stop-color="#34c759"/>
      <stop offset="68%" stop-color="#00c7be"/>
      <stop offset="84%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
    <radialGradient id="cin-beam" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ff6600" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cin-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1030"/>
      <stop offset="50%" stop-color="#1a2038"/>
      <stop offset="100%" stop-color="#301018"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cin-bg)"/>
  <ellipse cx="600" cy="80" rx="420" ry="260" fill="url(#cin-beam)"/>
  <!-- projector beam -->
  <path d="M560 40 L200 520 L1000 520 Z" fill="#ff6600" opacity="0.08"/>
  <path d="M580 40 L320 520 L880 520 Z" fill="#fff" opacity="0.06"/>
  <!-- cinema screen -->
  <rect x="220" y="180" width="760" height="420" rx="8" fill="#0a0a0e" stroke="#3a3a48" stroke-width="3"/>
  <rect x="245" y="205" width="710" height="370" rx="4" fill="url(#cin-screen)"/>
  <!-- vibrant colour bars on screen -->
  <g opacity="0.95">
    <rect x="245" y="280" width="710" height="48" fill="url(#cin-spec)"/>
    <rect x="280" y="350" width="640" height="36" fill="url(#cin-spec)" opacity="0.8"/>
    <rect x="320" y="410" width="560" height="28" fill="url(#cin-spec)" opacity="0.6"/>
    <rect x="380" y="460" width="440" height="20" fill="url(#cin-spec)" opacity="0.4"/>
  </g>
  <!-- colour orbs -->
  <circle cx="320" cy="250" r="18" fill="#ff2d55" opacity="0.9"/>
  <circle cx="400" cy="240" r="14" fill="#ff9500" opacity="0.9"/>
  <circle cx="470" cy="248" r="12" fill="#ffcc00" opacity="0.9"/>
  <circle cx="730" cy="245" r="14" fill="#007aff" opacity="0.9"/>
  <circle cx="810" cy="250" r="16" fill="#af52de" opacity="0.9"/>
  <circle cx="880" cy="242" r="11" fill="#34c759" opacity="0.9"/>
  <!-- seats hint -->
  <g opacity="0.35">
    <ellipse cx="360" cy="680" rx="70" ry="22" fill="#5a1020"/>
    <ellipse cx="520" cy="700" rx="70" ry="22" fill="#5a1020"/>
    <ellipse cx="680" cy="700" rx="70" ry="22" fill="#5a1020"/>
    <ellipse cx="840" cy="680" rx="70" ry="22" fill="#5a1020"/>
  </g>
</svg>
