<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Gaming experience">
  <defs>
    <linearGradient id="ga-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060816"/>
      <stop offset="50%" stop-color="#0c1230"/>
      <stop offset="100%" stop-color="#12081c"/>
    </linearGradient>
    <linearGradient id="ga-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="ga-pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f45"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <radialGradient id="ga-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7b2cbf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="700" fill="url(#ga-bg)"/>
  <ellipse cx="450" cy="280" rx="320" ry="220" fill="url(#ga-glow)"/>
  <!-- digital grid -->
  <g stroke="#00f5d4" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 140 H900 M0 220 H900 M0 300 H900 M0 380 H900 M0 460 H900"/>
    <path d="M150 80 V620 M300 80 V620 M450 80 V620 M600 80 V620 M750 80 V620"/>
  </g>
  <!-- HUD brackets -->
  <g fill="none" stroke="#00f5d4" stroke-width="2.5" opacity="0.7">
    <path d="M60 80 H120 V140 M840 80 H780 V140 M60 620 H120 V560 M840 620 H780 V560"/>
  </g>
  <!-- game controller -->
  <g transform="translate(450 340)">
    <path d="M-160 -40 C-160 -90, -120 -110, -60 -110 H60 C120 -110, 160 -90, 160 -40 L180 40 C185 70, 160 95, 125 90 L80 80 H-80 L-125 90 C-160 95, -185 70, -180 40 Z" fill="url(#ga-pad)" stroke="url(#ga-neon)" stroke-width="2.5"/>
    <!-- D-pad -->
    <rect x="-110" y="-18" width="44" height="14" rx="3" fill="#0e121c"/>
    <rect x="-95" y="-33" width="14" height="44" rx="3" fill="#0e121c"/>
    <!-- action buttons -->
    <circle cx="70" cy="-25" r="12" fill="#ff006e"/>
    <circle cx="98" cy="0" r="12" fill="#00f5d4"/>
    <circle cx="70" cy="25" r="12" fill="#fee440"/>
    <circle cx="42" cy="0" r="12" fill="#7b2cbf"/>
    <!-- sticks -->
    <circle cx="-45" cy="35" r="18" fill="#0e121c" stroke="#3a4258" stroke-width="2"/>
    <circle cx="-45" cy="35" r="8" fill="#5a6478"/>
    <circle cx="45" cy="35" r="18" fill="#0e121c" stroke="#3a4258" stroke-width="2"/>
    <circle cx="45" cy="35" r="8" fill="#5a6478"/>
  </g>
  <!-- pixel burst -->
  <g opacity="0.85">
    <rect x="160" y="160" width="18" height="18" fill="#00f5d4"/>
    <rect x="700" y="140" width="14" height="14" fill="#ff006e"/>
    <rect x="740" y="180" width="20" height="20" fill="#fee440"/>
    <rect x="120" y="220" width="12" height="12" fill="#7b2cbf"/>
    <rect x="760" y="480" width="16" height="16" fill="#00f5d4"/>
    <rect x="140" y="500" width="14" height="14" fill="#ff006e"/>
  </g>
  <text x="450" y="120" text-anchor="middle" fill="#00f5d4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" opacity="0.8">PLAYER ONE</text>
</svg>
