<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="Google TV platform visual for Zenith">
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="50%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="33%" stop-color="#34a853"/>
      <stop offset="66%" stop-color="#fbbc05"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
    <linearGradient id="zscreen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <radialGradient id="zglow" cx="48%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zblue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6aa4ff"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="zcard1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="zcard2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#1e8e3e"/>
    </linearGradient>
    <linearGradient id="zcard3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbc05"/>
      <stop offset="100%" stop-color="#f9ab00"/>
    </linearGradient>
    <linearGradient id="zcard4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea4335"/>
      <stop offset="100%" stop-color="#d93025"/>
    </linearGradient>
  </defs>

  <rect width="960" height="660" fill="url(#zbg)"/>
  <ellipse cx="460" cy="280" rx="360" ry="220" fill="url(#zglow)"/>

  <!-- soft spectrum arcs -->
  <g fill="none" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M120 520 C220 320, 340 220, 480 200" stroke="#4285f4"/>
    <path d="M160 560 C260 360, 380 250, 520 220" stroke="#34a853"/>
    <path d="M200 590 C300 400, 420 280, 560 240" stroke="#fbbc05"/>
    <path d="M240 620 C340 440, 460 310, 600 260" stroke="#ea4335"/>
  </g>
  <g fill="none" stroke-width="10" stroke-linecap="round" opacity="0.2">
    <path d="M720 120 C640 220, 580 300, 540 360" stroke="#4285f4"/>
    <path d="M760 140 C680 250, 610 330, 560 390" stroke="#34a853"/>
    <path d="M800 160 C720 280, 640 360, 580 420" stroke="#fbbc05"/>
    <path d="M840 180 C760 300, 680 390, 600 450" stroke="#ea4335"/>
  </g>

  <!-- ultrathin display -->
  <g transform="translate(480 300)">
    <rect x="-260" y="-148" width="520" height="296" rx="14" fill="#05070b" stroke="#2a3344" stroke-width="2"/>
    <rect x="-246" y="-134" width="492" height="268" rx="6" fill="url(#zscreen)"/>

    <!-- Google-colored top rail -->
    <rect x="-246" y="-134" width="492" height="4" fill="url(#zg)"/>

    <!-- hero tile -->
    <rect x="-220" y="-100" width="280" height="150" rx="12" fill="url(#zcard1)" opacity="0.92"/>
    <circle cx="-160" cy="-40" r="22" fill="#fff" opacity="0.2"/>
    <path d="M-168 -50 L-168 -30 L-148 -40 Z" fill="#fff" opacity="0.9"/>
    <rect x="-200" y="20" width="140" height="8" rx="4" fill="#fff" opacity="0.55"/>
    <rect x="-200" y="38" width="90" height="6" rx="3" fill="#fff" opacity="0.3"/>

    <!-- side stack -->
    <rect x="80" y="-100" width="140" height="68" rx="10" fill="url(#zcard2)" opacity="0.9"/>
    <rect x="80" y="-18" width="140" height="68" rx="10" fill="url(#zcard3)" opacity="0.9"/>
    <rect x="80" y="64" width="140" height="42" rx="10" fill="url(#zcard4)" opacity="0.88"/>

    <!-- recommendation dots -->
    <g transform="translate(-200 78)">
      <circle r="5" fill="#4285f4"/>
      <circle cx="22" r="5" fill="#34a853"/>
      <circle cx="44" r="5" fill="#fbbc05"/>
      <circle cx="66" r="5" fill="#ea4335"/>
    </g>

    <!-- stand -->
    <path d="M-24 152 L24 152 L42 178 L-42 178 Z" fill="#1a2030"/>
    <rect x="-64" y="178" width="128" height="7" rx="2" fill="#252d3d"/>
  </g>

  <!-- Google TV chip removed — badge is rendered in HTML with imported Google logo -->
</svg>
