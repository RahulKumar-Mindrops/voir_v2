<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Vivid colour spectrum">
  <defs>
    <linearGradient id="vc-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#1a1024"/>
    </linearGradient>
    <linearGradient id="vc-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="18%" stop-color="#ff9500"/>
      <stop offset="36%" stop-color="#ffcc00"/>
      <stop offset="52%" stop-color="#34c759"/>
      <stop offset="68%" stop-color="#00c7be"/>
      <stop offset="82%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
    <radialGradient id="vc-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#vc-sky)"/>
  <ellipse cx="320" cy="160" rx="220" ry="120" fill="url(#vc-glow)"/>
  <g opacity="0.95">
    <rect x="48" y="78" width="544" height="36" rx="18" fill="url(#vc-band)"/>
    <rect x="72" y="130" width="496" height="28" rx="14" fill="url(#vc-band)" opacity="0.85"/>
    <rect x="104" y="174" width="432" height="22" rx="11" fill="url(#vc-band)" opacity="0.7"/>
    <rect x="140" y="212" width="360" height="16" rx="8" fill="url(#vc-band)" opacity="0.55"/>
  </g>
  <g fill="#fff" opacity="0.9">
    <circle cx="120" cy="280" r="10" fill="#ff3b30"/>
    <circle cx="170" cy="280" r="10" fill="#ff9500"/>
    <circle cx="220" cy="280" r="10" fill="#ffcc00"/>
    <circle cx="270" cy="280" r="10" fill="#34c759"/>
    <circle cx="320" cy="280" r="10" fill="#00c7be"/>
    <circle cx="370" cy="280" r="10" fill="#007aff"/>
    <circle cx="420" cy="280" r="10" fill="#5856d6"/>
    <circle cx="470" cy="280" r="10" fill="#af52de"/>
  </g>
