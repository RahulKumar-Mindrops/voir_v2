<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Smart intelligence network">
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <radialGradient id="ai-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab4f8"/>
      <stop offset="55%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ai-bg)"/>
  <!-- network links -->
  <g stroke="#5b8def" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M320 180 L180 110 M320 180 L460 110 M320 180 L150 220 M320 180 L490 220 M320 180 L240 280 M320 180 L400 280"/>
    <path d="M180 110 L150 220 M460 110 L490 220 M150 220 L240 280 M490 220 L400 280 M180 110 L240 70 M460 110 L400 70"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="320" cy="180" r="28" fill="url(#ai-core)"/>
    <circle cx="320" cy="180" r="12" fill="#fff" opacity="0.9"/>
    <circle cx="180" cy="110" r="10" fill="#8ab4f8"/>
    <circle cx="460" cy="110" r="10" fill="#8ab4f8"/>
    <circle cx="150" cy="220" r="9" fill="#a78bfa"/>
    <circle cx="490" cy="220" r="9" fill="#a78bfa"/>
    <circle cx="240" cy="280" r="8" fill="#ff6600"/>
    <circle cx="400" cy="280" r="8" fill="#ff6600"/>
    <circle cx="240" cy="70" r="7" fill="#34d399"/>
    <circle cx="400" cy="70" r="7" fill="#34d399"/>
  </g>
  <!-- chip outline -->
  <rect x="286" y="146" width="68" height="68" rx="10" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <g stroke="#fff" stroke-opacity="0.2" stroke-width="1.5">
    <path d="M300 146 V130 M320 146 V128 M340 146 V130 M300 214 V230 M320 214 V232 M340 214 V230"/>
    <path d="M286 160 H270 M286 180 H268 M286 200 H270 M354 160 H370 M354 180 H372 M354 200 H370"/>
  </g>
</svg>
