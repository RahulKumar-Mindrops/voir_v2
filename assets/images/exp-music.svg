<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Music and audio experience">
  <defs>
    <linearGradient id="mu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10080e"/>
      <stop offset="100%" stop-color="#1a0c14"/>
    </linearGradient>
    <linearGradient id="mu-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b6b"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ffcc33"/>
    </linearGradient>
    <radialGradient id="mu-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="700" fill="url(#mu-bg)"/>
  <ellipse cx="450" cy="320" rx="300" ry="220" fill="url(#mu-glow)"/>
  <!-- concentric sound rings -->
  <g fill="none" stroke="#ff6600" stroke-opacity="0.22" stroke-width="2">
    <circle cx="450" cy="320" r="90"/>
    <circle cx="450" cy="320" r="140"/>
    <circle cx="450" cy="320" r="190"/>
    <circle cx="450" cy="320" r="240"/>
  </g>
  <!-- vinyl / disc -->
  <circle cx="450" cy="320" r="78" fill="#1a1a1a" stroke="#ff6600" stroke-width="3"/>
  <circle cx="450" cy="320" r="55" fill="none" stroke="#333" stroke-width="8"/>
  <circle cx="450" cy="320" r="18" fill="url(#mu-wave)"/>
  <circle cx="450" cy="320" r="7" fill="#1a1a1a"/>
  <!-- equalizer bars -->
  <g transform="translate(450 520)">
    <rect x="-160" y="-40" width="14" height="40" rx="4" fill="#ff3b6b">
      <animate attributeName="height" values="24;56;32;64;28;48;24" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-24;-56;-32;-64;-28;-48;-24" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-130" y="-60" width="14" height="60" rx="4" fill="#ff6600">
      <animate attributeName="height" values="50;28;70;36;58;30;50" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-50;-28;-70;-36;-58;-30;-50" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-100" y="-48" width="14" height="48" rx="4" fill="#ffcc33">
      <animate attributeName="height" values="36;62;28;54;40;68;36" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-36;-62;-28;-54;-40;-68;-36" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="-70" y="-70" width="14" height="70" rx="4" fill="#ff3b6b">
      <animate attributeName="height" values="60;34;72;42;58;30;60" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-60;-34;-72;-42;-58;-30;-60" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="-40" y="-52" width="14" height="52" rx="4" fill="#ff6600">
      <animate attributeName="height" values="40;66;30;58;44;70;40" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-40;-66;-30;-58;-44;-70;-40" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-10" y="-64" width="14" height="64" rx="4" fill="#ffcc33">
      <animate attributeName="height" values="55;30;68;38;60;28;55" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-55;-30;-68;-38;-60;-28;-55" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="-44" width="14" height="44" rx="4" fill="#ff3b6b">
      <animate attributeName="height" values="28;58;36;64;32;50;28" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-28;-58;-36;-64;-32;-50;-28" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="-58" width="14" height="58" rx="4" fill="#ff6600">
      <animate attributeName="height" values="48;26;62;34;56;30;48" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-48;-26;-62;-34;-56;-30;-48" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="-46" width="14" height="46" rx="4" fill="#ffcc33">
      <animate attributeName="height" values="34;60;28;52;40;66;34" dur="1.18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-34;-60;-28;-52;-40;-66;-34" dur="1.18s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" y="-54" width="14" height="54" rx="4" fill="#ff3b6b">
      <animate attributeName="height" values="42;68;32;56;38;62;42" dur="1.02s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-42;-68;-32;-56;-38;-62;-42" dur="1.02s" repeatCount="indefinite"/>
    </rect>
    <rect x="140" y="-38" width="14" height="38" rx="4" fill="#ff6600">
      <animate attributeName="height" values="22;50;30;58;26;44;22" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-22;-50;-30;-58;-26;-44;-22" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- waveform -->
  <path d="M80 200 C140 140, 180 260, 240 200 S340 120, 400 200 S500 280, 560 200 S660 140, 720 200 S800 260, 860 200" fill="none" stroke="url(#mu-wave)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
</svg>
